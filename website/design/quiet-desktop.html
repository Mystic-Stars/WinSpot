<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinSpot · 山间桌面</title>
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; color: #222831; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    img { display: block; object-fit: contain; }
    a { color: inherit; text-decoration: none; }
    header { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 7%; background: #fff; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 650; }
    nav { display: flex; gap: 28px; color: #69727f; font-size: 14px; }
    .get { padding: 10px 16px; border-radius: 6px; background: #22262d; color: #fff; font-size: 13px; }
    main { position: relative; isolation: isolate; padding: 36px 24px 30px; text-align: center; }
    .wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    .eyebrow { font-size: 13px; color: #435369; margin: 0; line-height: 1.75; }
    h1 { font-family: "Segoe UI", Arial, sans-serif; font-size: 86px; line-height: 1.12; margin: 5px 0 6px; font-weight: 700; }
    h1 span { color: #bd596c; }
    .tagline { font-size: 28px; margin: 0; line-height: 1.4; font-weight: 500; }
    .description { font-size: 15px; color: #4b596a; line-height: 1.75; margin: 12px 0 21px; }
    .action { display: inline-block; background: #22262d; color: #fff; border-radius: 6px; padding: 12px 23px; font-size: 14px; }
    .launcher { margin: 28px auto 0; max-width: 730px; text-align: left; background: #f8faffcc; border: 1px solid #ffffffaa; border-radius: 22px; backdrop-filter: blur(26px); box-shadow: 0 18px 55px #1a2b4925; }
    .toolbar { padding: 15px 21px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #6c7d9122; font-size: 16px; color: #657083; }
    .categories { display: flex; gap: 25px; padding: 15px 27px 8px; color: #657083; font-size: 12px; }
    .categories span:first-child { color: #2a3342; font-weight: 600; }
    .apps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 12px 20px 20px; gap: 19px 16px; }
    .apps div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; min-width: 0; }
    .apps img { width: 41px; height: 41px; }
    .apps span { overflow: hidden; max-width: 100%; text-overflow: ellipsis; white-space: nowrap; }
    .bottom { border-top: 1px solid #6c7d9122; padding: 11px 25px; color: #657083; font-size: 11px; }
    .caption { margin-top: 18px; font-size: 12px; color: #fff; }
    footer { padding: 30px 20px; display: flex; justify-content: center; gap: 60px; color: #69727f; font-size: 13px; background: #fafbfc; }
    @media (max-width: 600px) { header { height: 64px; padding: 0 20px; } nav { display: none; } main { padding: 28px 14px; } h1 { font-size: 64px; } .tagline { font-size: 23px; } .description { max-width: 260px; margin-left: auto; margin-right: auto; } .apps { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 12px; } .apps div:nth-child(n+10) { display: none; } .categories { gap: 18px; padding: 14px 18px 8px; } footer { gap: 20px; flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header><a class="brand" href="#top"><img src="../assets/winspot.png" width="34" height="34" alt="">WinSpot</a><nav><a href="#next">功能</a><a href="#next">外观</a><a href="#next">隐私</a></nav><a class="get" href="#next">获取 WinSpot</a></header>
  <main id="top">
    <img class="wallpaper" src="../assets/mountains.jpg" width="2400" height="1590" alt="">
    <p class="eyebrow">为 Windows 11 而生</p>
    <h1>WinSpot<span>.</span></h1>
    <p class="tagline">你的桌面，触手可及。</p>
    <p class="description">应用、文件、下一件想做的事。一个入口，刚刚好。</p>
    <a class="action" href="#next">获取 WinSpot</a>
    <div class="launcher">
      <div class="toolbar"><img src="../assets/winspot.png" width="28" height="28" alt=""><span>搜索应用和文件…</span></div>
      <div class="categories"><span>全部</span><span>效率</span><span>创意</span><span>开发</span><span>社交</span></div>
      <div class="apps">
        <div><img src="../assets/vscode.svg" alt=""><span>VS Code</span></div><div><img src="../assets/chrome.svg" alt=""><span>Chrome</span></div><div><img src="../assets/figma.svg" alt=""><span>Figma</span></div><div><img src="../assets/wechat.svg" alt=""><span>微信</span></div><div><img src="../assets/notion.svg" alt=""><span>Notion</span></div>
        <div><img src="../assets/spotify.svg" alt=""><span>Spotify</span></div><div><img src="../assets/blender.svg" alt=""><span>Blender</span></div><div><img src="../assets/word.svg" alt=""><span>Word</span></div><div><img src="../assets/edge.svg" alt=""><span>Edge</span></div><div><img src="../assets/photoshop.svg" alt=""><span>Photoshop</span></div>
        <div><img src="../assets/github.svg" alt=""><span>GitHub Desktop</span></div><div><img src="../assets/excel.svg" alt=""><span>Excel</span></div><div><img src="../assets/slack.svg" alt=""><span>Slack</span></div><div><img src="../assets/steam.svg" alt=""><span>Steam</span></div><div><img src="../assets/firefox.svg" alt=""><span>Firefox</span></div>
      </div>
      <div class="bottom">VS Code · 开发 · 代码编辑器</div>
    </div>
    <p class="caption">少一点打扰，多一点专注</p>
  </main>
  <footer id="next"><span>键盘优先</span><span>自动整理</span><span>完全本地</span><span>无需账号</span></footer>
</body>
</html>
