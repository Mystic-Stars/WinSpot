[package]
name = "winspot"
version = "0.1.0"
description = "A considered, local-first Windows launcher."
authors = ["WinSpot"]
edition = "2021"
rust-version = "1.94"

[lib]
name = "winspot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
notify = "8"
pinyin = "0.10"
fuzzy-matcher = "0.3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
winreg = "0.55"
windows-core = "0.61"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
  "Foundation", "Graphics_Effects", "System", "UI_Composition", "UI_Composition_Desktop",
  "Win32_Graphics_Direct2D", "Win32_System_WinRT",
  "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_Variant",
  "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage",
  "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "unwind"
